# 一键「继续」插件（Continue button）
#
# 输入栏下方（composer 停靠区）加一颗「继续」按钮：意外中断的会话点一下就重新跑起来；
# 同时监听网络中断 / 上游截断（输出超限、断流），恢复后等 1~3 秒自动补发一次「继续」。
#
# Host 半身持有唯一的中断判定与续跑预算，Client 半身只渲染按钮并调用同一组路由。
# 下面每一项都可改；字段语义见 index.js 的 DEFAULTS 与 Config。
- insert:
    - id: dsh-continue-guard
      name: 'dsh-continue-guard'
      config:
        enabled: true
        # 按钮与自动续跑发送的文本。
        text: 继续
        # 自动续跑总开关。关掉后只剩手动按钮。
        autoResume: true
        # 网络恢复后到发出「继续」的等待（毫秒），建议 1000~3000。
        resumeDelayMs: 2000
        # 同一会话连续自动续跑的次数上限；人一说话就清零。
        maxAutoResumes: 3
        # 普通模型/代理错误是否也自动续跑。
        # 默认否：AUTH、额度耗尽与断网在本地无法区分，自动重试会白烧额度。
        autoResumeOnError: false
        # 输出在 max-tokens 处被截断时自动续跑（这类截断重试是安全的）。
        resumeOnTruncation: true
        # 连通性探测目标，按顺序尝试。换成你自己的网关更可靠：
        # 有些环境会拦这些域名，探测失败会被当成「还没联网」。
        probeUrls:
          - https://api.deepseek.com
          - https://www.baidu.com
          - https://github.com
        probeTimeoutMs: 4000
        probeRetries: 5
        probeBackoffMs: 3000
        probeBackoffMaxMs: 30000
        # ── 常驻网络监测 ──
        # 挂载后立刻探一次，之后按这个间隔一直探下去（无关是否有会话在等待）。
        # 为什么必须常驻：WiFi 掉线再来，宿主收不到任何一个可靠事件；「链路还在断」
        # 和「已经能上网」唯一的分辨办法就是不停地问。10 秒既是要求的节奏，也就是
        # 「网回来了」到「会话被接上」之间最坏的延迟。
        # 每次检查是并行的单次尝试（不重试），所以一轮最多花 probeTimeoutMs，
        # 不会像串联重试那样占住一分钟以上、把恢复边沿吞掉。
        netCheckIntervalMs: 10000
        # 同一会话两次自动续跑之间的最小间隔（毫秒）。
        minResumeGapMs: 4000
        # 按钮外观：是否画胶囊底/描边；是否把中断原因写进 hover 提示。
        pill: true
        showReason: true
        # 排查「为什么没自动继续」时打开：每次判定与续跑都写进宿主日志。
        verbose: false
        # ── 启动恢复 ──
        # 宿主重启后扫描最近的会话日志：上一轮「开着没关」的回合说明进程是在跑的时候
        # 被杀掉的——这类会话没有活着的 agent，也没有内存里的中断状态，只有日志留着证据。
        # 扫到就按同一套预算/探测/间隔规则自动接上；用户自己按过停止的会话永不接。
        startupResume: true
        # 往前看多久（毫秒）。默认一天：够覆盖「刚刚那次意外退出」，又不会翻出陈年旧账。
        startupResumeWithinMs: 86400000
        # 一次启动最多接上几个会话（按最后活动时间从新到旧）。
        startupResumeLimit: 3
